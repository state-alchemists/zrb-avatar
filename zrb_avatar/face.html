<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>zrb face</title>
<style>
  :root { --glow: #3cf; }
  html, body { margin: 0; height: 100%; background: #0a0a10; overflow: hidden; }
  /* In the desktop app (?app) the window is see-through; js/desktop.js drags it by her body. */
  html.app, html.app body { background: transparent; }
  canvas {
    display: block;
    /* The glow around her outline shows the state. */
    filter: contrast(1.05) saturate(.85) drop-shadow(0 0 6px var(--glow));
  }
  #status { position: fixed; bottom: 8px; width: 100%; text-align: center; color: var(--glow); font: 12px monospace; opacity: .7; }
  html.app #status { display: none; }
  html.app #status.error { display: block; color: #f46; opacity: 1; }
  /* What she is saying: under her, over the status line, gone when the voice stops. The client
     sends a clear as the audio is read, so a line is held for a minimum time rather than
     blinking out between chunks — see js/main.js showSubtitle. */
  #subtitle {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    max-width: min(88%, 40em); padding: 6px 12px; border-radius: 9px;
    background: rgba(9, 11, 18, .74); color: #eaf6ff;
    font: var(--subtitle-size, 15px)/1.35 system-ui, -apple-system, sans-serif;
    text-align: center; opacity: 0; transition: opacity .16s ease-out;
    pointer-events: none; /* the window is dragged by her body, never by a caption */
  }
  #subtitle.on { opacity: 1; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js",
  "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.1.0/lib/three-vrm-animation.module.min.js"
} }
</script>
</head>
<body>
<div id="subtitle"></div>
<div id="status">loading…</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
